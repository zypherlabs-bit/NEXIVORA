[package]
name = "nexivora-desktop"
version = "0.1.0"
edition = "2021"
description = "Nexivora — Free, open-source, cross-platform office suite"
license = "AGPL-3.0-or-later"
repository = "https://github.com/zypherlabs-bit/NEXIVORA"

[[bin]]
name = "nexivora-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
