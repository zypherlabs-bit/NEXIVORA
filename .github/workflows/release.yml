name: Release Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create/update (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build — Windows x64
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.toml') }}
            ${{ runner.os }}-cargo-windows-

      - name: Verify frontend assets exist
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if (-not (Test-Path dist/index.html)) {
            Write-Host "ERROR: dist/index.html missing — run 'npm run tauri info' or build frontend"
            exit 1
          }
          Write-Host "Frontend assets OK"
          Get-ChildItem dist | Select-Object Name, Length

      - name: Windows Authenticode Signing — Setup PFX (optional)
        shell: pwsh
        if: ${{ env.WINDOWS_PFX_BASE64 != '' && env.WINDOWS_PFX_PASSWORD != '' }}
        run: |
          $pfxBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_PFX_BASE64 }}")
          [System.IO.File]::WriteAllBytes("$(pwd)/codesign.pfx", $pfxBytes)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import("$(pwd)/codesign.pfx", "${{ secrets.WINDOWS_PFX_PASSWORD }}", [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          $thumbprint = $cert.Thumbprint
          Write-Host "Certificate thumbprint: $thumbprint"
          echo "WINDOWS_PFX_PATH=$(pwd)/codesign.pfx" >> $env:GITHUB_ENV
          echo "WINDOWS_CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

      - name: Clean build workspace
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if (Test-Path target) { Remove-Item -Recurse -Force target }
          Write-Host "Cleaned target directory"

      - name: Build and bundle — Windows
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_TRUST_KEY: ${{ secrets.TAURI_TRUST_KEY }}
          TAURI_TRUST_KEY_PASSWORD: ${{ secrets.TAURI_TRUST_KEY_PASSWORD }}
        run: |
          $env:TAURI_TRUST_KEY = if ("${{ secrets.TAURI_TRUST_KEY }}" -ne "") { "${{ secrets.TAURI_TRUST_KEY }}" } else { $null }
          $env:TAURI_TRUST_KEY_PASSWORD = if ("${{ secrets.TAURI_TRUST_KEY_PASSWORD }}" -ne "") { "${{ secrets.TAURI_TRUST_KEY_PASSWORD }}" } else { $null }
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            $signCmd = "signtool sign /fd SHA256 /sha1 $env:WINDOWS_CERT_THUMBPRINT /tr http://timestamp.digicert.com /td SHA256 `"`%1`""
            $env:TAURI_WINDOWS_SIGN_COMMAND = $signCmd
          }
          npm run tauri build -- --bundles msi,nsis

      - name: Package — Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Nexivora-Portable | Out-Null
          Copy-Item target/release/nexivora-desktop.exe Nexivora-Portable/Nexivora.exe
          Copy-Item README.md Nexivora-Portable/README.md
          Copy-Item LICENSE Nexivora-Portable/LICENSE
          Compress-Archive -Path Nexivora-Portable/* -DestinationPath Nexivora-Windows-Portable.zip -Force

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          Copy-Item target/release/nexivora-desktop.exe Nexivora-Windows-x64.exe
          $msi = Get-ChildItem -Path "target/release/bundle/msi/Nexivora_*_x64_en-US.msi" | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName Nexivora-Windows-x64.msi } else { Write-Host "WARNING: MSI not found" }
          $nsis = Get-ChildItem -Path "target/release/bundle/nsis/Nexivora_*_x64-setup.exe" | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName Nexivora-Windows-x64-setup.exe } else { Write-Host "WARNING: NSIS setup not found" }

      - name: SHA-256 Checksums (Windows)
        shell: pwsh
        run: |
          $files = @(
            "Nexivora-Windows-x64.exe",
            "Nexivora-Windows-x64.msi",
            "Nexivora-Windows-x64-setup.exe",
            "Nexivora-Windows-Portable.zip"
          )
          foreach ($f in $files) {
            if (Test-Path $f) {
              $h = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
              "$h  $f" | Set-Content "$f.sha256" -Encoding ASCII
            }
          }

      - name: Verify binaries exist
        shell: pwsh
        run: |
          $required = @("Nexivora-Windows-x64.exe", "Nexivora-Windows-x64.msi", "Nexivora-Windows-x64-setup.exe", "Nexivora-Windows-Portable.zip")
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "MISSING: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Windows artifacts OK"
          Get-Item Nexivora-Windows-x64.exe, Nexivora-Windows-x64.msi, Nexivora-Windows-x64-setup.exe, Nexivora-Windows-Portable.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            Nexivora-Windows-x64.exe
            Nexivora-Windows-x64.exe.sha256
            Nexivora-Windows-x64.msi
            Nexivora-Windows-x64.msi.sha256
            Nexivora-Windows-x64-setup.exe
            Nexivora-Windows-x64-setup.exe.sha256
            Nexivora-Windows-Portable.zip
            Nexivora-Windows-Portable.zip.sha256

  build-linux:
    name: Build — Linux x86_64 (AppImage, DEB, RPM)
    runs-on: ubuntu-22.04
    env:
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-${{ hashFiles('**/Cargo.toml') }}
            ${{ runner.os }}-cargo-linux-

      - name: Install system dependencies (Tauri + AppImage + packaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            libssl-dev \
            pkg-config \
            desktop-file-utils \
            rpm \
            appstream \
            dpkg-sig \
            libimage-exiftool-perl
          sudo modprobe fuse 2>/dev/null || true

      - name: Verify frontend assets exist
        working-directory: apps/desktop
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html missing — run 'npm run tauri info' or build frontend"
            exit 1
          fi
          echo "Frontend assets OK"
          ls -lh dist

      - name: Clean build workspace
        working-directory: apps/desktop
        run: |
          if [ -d target ]; then rm -rf target; fi
          echo "Cleaned target directory"

      - name: GPG Signing Setup for DEB/RPM (optional)
        if: ${{ env.LINUX_GPG_PRIVATE_KEY != '' && env.LINUX_GPG_PASSPHRASE != '' }}
        env:
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          echo "${{ secrets.LINUX_GPG_PRIVATE_KEY }}" | gpg --batch --import --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE"
          gpg --list-secret-keys --keyid-format LONG
          gpg --armor --export "${{ secrets.LINUX_GPG_KEY_ID }}" > signing-key.asc
          echo "GPG signing key imported"

      - name: Build and bundle — Linux (AppImage, DEB, RPM)
        working-directory: apps/desktop
        env:
          TAURI_TRUST_KEY: ${{ secrets.TAURI_TRUST_KEY }}
          TAURI_TRUST_KEY_PASSWORD: ${{ secrets.TAURI_TRUST_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles appimage,deb,rpm

      - name: Collect Linux artifacts
        run: |
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n1)
          DEB=$(ls target/release/bundle/deb/*.deb 2>/dev/null | head -n1)
          RPM=$(ls target/release/bundle/rpm/*.rpm 2>/dev/null | head -n1)
          if [ -z "$APPIMAGE" ]; then echo "ERROR: AppImage not found"; exit 1; fi
          if [ -z "$DEB" ]; then echo "ERROR: DEB not found"; exit 1; fi
          if [ -z "$RPM" ]; then echo "ERROR: RPM not found"; exit 1; fi
          cp "$APPIMAGE" Nexivora-Linux-x86_64.AppImage
          cp "$DEB" nexivora-amd64.deb
          cp "$RPM" nexivora-x86_64.rpm

      - name: GPG Sign DEB and RPM packages (optional)
        if: ${{ env.LINUX_GPG_PRIVATE_KEY != '' && env.LINUX_GPG_PASSPHRASE != '' }}
        env:
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          gpg --batch --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE" --default-key "$LINUX_GPG_KEY_ID" --detach-sign --armor nexivora-amd64.deb
          gpg --batch --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE" --default-key "$LINUX_GPG_KEY_ID" --detach-sign --armor nexivora-x86_64.rpm
          echo "DEB and RPM packages signed with GPG"

      - name: Validate AppImage
        run: |
          chmod +x Nexivora-Linux-x86_64.AppImage
          ./Nexivora-Linux-x86_64.AppImage --appimage-extract-and-run --version 2>&1 || true
          echo "AppImage validation complete"

      - name: Validate Linux packages metadata
        run: |
          desktop-file-validate target/release/bundle/deb/*.deb 2>/dev/null || echo "desktop-file-validate not available, skipping"
          appstream-util validate-relax target/release/bundle/deb/*.deb 2>/dev/null || echo "appstream validation skipped"

      - name: SHA-256 Checksums (Linux)
        run: |
          sha256sum Nexivora-Linux-x86_64.AppImage > Nexivora-Linux-x86_64.AppImage.sha256
          sha256sum nexivora-amd64.deb > nexivora-amd64.deb.sha256
          sha256sum nexivora-x86_64.rpm > nexivora-x86_64.rpm.sha256
          if ls *.deb.asc >/dev/null 2>&1; then
            cat nexivora-amd64.deb.asc >> nexivora-amd64.deb.sha256
          fi
          if ls *.rpm.asc >/dev/null 2>&1; then
            cat nexivora-x86_64.rpm.asc >> nexivora-x86_64.rpm.sha256
          fi

      - name: Verify binaries exist
        run: |
          ls -lh Nexivora-Linux-x86_64.AppImage nexivora-amd64.deb nexivora-x86_64.rpm
          test -f Nexivora-Linux-x86_64.AppImage || (echo "MISSING AppImage" && exit 1)
          test -f nexivora-amd64.deb || (echo "MISSING DEB" && exit 1)
          test -f nexivora-x86_64.rpm || (echo "MISSING RPM" && exit 1)
          echo "Linux artifacts OK"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            Nexivora-Linux-x86_64.AppImage
            Nexivora-Linux-x86_64.AppImage.sha256
            nexivora-amd64.deb
            nexivora-amd64.deb.sha256
            nexivora-x86_64.rpm
            nexivora-x86_64.rpm.sha256
            *.asc

  build-macos:
    name: Build — macOS Universal (Apple Silicon + Intel)
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Rust stable with universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.toml') }}
            ${{ runner.os }}-cargo-macos-

      - name: Verify frontend assets exist
        working-directory: apps/desktop
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html missing — run 'npm run tauri info' or build frontend"
            exit 1
          fi
          echo "Frontend assets OK"
          ls -lh dist

      - name: macOS Signing & Notarization Setup (optional)
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' }}
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$APPLE_P12_BASE64" ]; then
            security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
            security list-keychains -s build.keychain
            echo "$APPLE_P12_BASE64" | base64 -d -o certificate.p12
            security import certificate.p12 -k build.keychain -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
            echo "TAURI_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> $GITHUB_ENV
            echo "TAURI_NOTARYTOOL_APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "TAURI_NOTARYTOOL_APPLE_PASSWORD=${{ secrets.APPLE_APP_PASSWORD }}" >> $GITHUB_ENV
            echo "TAURI_NOTARYTOOL_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
            echo "Apple signing identity configured: ${{ secrets.APPLE_SIGNING_IDENTITY }}"
          fi

      - name: Clean build workspace
        working-directory: apps/desktop
        run: |
          if [ -d target ]; then rm -rf target; fi
          echo "Cleaned target directory"

      - name: Build and bundle — macOS Universal (Apple Silicon + Intel)
        working-directory: apps/desktop
        env:
          TAURI_TRUST_KEY: ${{ secrets.TAURI_TRUST_KEY }}
          TAURI_TRUST_KEY_PASSWORD: ${{ secrets.TAURI_TRUST_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Build per-architecture DMGs (optional)
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' }}
        working-directory: apps/desktop
        env:
          TAURI_TRUST_KEY: ${{ secrets.TAURI_TRUST_KEY }}
          TAURI_TRUST_KEY_PASSWORD: ${{ secrets.TAURI_TRUST_KEY_PASSWORD }}
          TAURI_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_NOTARYTOOL_APPLE_ID: ${{ secrets.APPLE_ID }}
          TAURI_NOTARYTOOL_APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TAURI_NOTARYTOOL_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run tauri build -- --target aarch64-apple-darwin --bundles dmg
          npm run tauri build -- --target x86_64-apple-darwin --bundles dmg

      - name: Collect macOS artifacts
        run: |
          UNI_DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -n1)
          if [ -z "$UNI_DMG" ]; then
            echo "ERROR: Universal DMG not found"
            ls -R target/universal-apple-darwin/release/bundle/dmg 2>/dev/null || true
            exit 1
          fi
          cp "$UNI_DMG" Nexivora-macOS-Universal.dmg
          shasum -a 256 Nexivora-macOS-Universal.dmg > Nexivora-macOS-Universal.dmg.sha256

          ARM_DMG=$(ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -n1)
          X64_DMG=$(ls target/x86_64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -n1)

          if [ -n "$ARM_DMG" ]; then
            cp "$ARM_DMG" Nexivora-macOS-AppleSilicon.dmg
            shasum -a 256 Nexivora-macOS-AppleSilicon.dmg > Nexivora-macOS-AppleSilicon.dmg.sha256
          else
            echo "WARNING: Apple Silicon DMG not found, using Universal as fallback"
            cp Nexivora-macOS-Universal.dmg Nexivora-macOS-AppleSilicon.dmg
            shasum -a 256 Nexivora-macOS-AppleSilicon.dmg > Nexivora-macOS-AppleSilicon.dmg.sha256
          fi

          if [ -n "$X64_DMG" ]; then
            cp "$X64_DMG" Nexivora-macOS-Intel.dmg
            shasum -a 256 Nexivora-macOS-Intel.dmg > Nexivora-macOS-Intel.dmg.sha256
          else
            echo "WARNING: Intel DMG not found, using Universal as fallback"
            cp Nexivora-macOS-Universal.dmg Nexivora-macOS-Intel.dmg
            shasum -a 256 Nexivora-macOS-Intel.dmg > Nexivora-macOS-Intel.dmg.sha256
          fi

      - name: Verify notarization (optional)
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' }}
        run: |
          echo "Checking code signature on Nexivora-macOS-Universal.dmg..."
          codesign -dv --verbose=4 Nexivora-macOS-Universal.dmg 2>&1 || echo "Note: codesign on DMG checks the image, not the embedded app"
          echo "macOS signing and notarization steps completed"

      - name: Verify binaries exist
        run: |
          ls -lh Nexivora-macOS-*.dmg || true
          test -f Nexivora-macOS-Universal.dmg || (echo "MISSING Universal DMG" && exit 1)
          test -f Nexivora-macOS-AppleSilicon.dmg || (echo "MISSING AppleSilicon DMG" && exit 1)
          test -f Nexivora-macOS-Intel.dmg || (echo "MISSING Intel DMG" && exit 1)
          echo "macOS artifacts OK"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            Nexivora-macOS-Intel.dmg
            Nexivora-macOS-Intel.dmg.sha256
            Nexivora-macOS-AppleSilicon.dmg
            Nexivora-macOS-AppleSilicon.dmg.sha256
            Nexivora-macOS-Universal.dmg
            Nexivora-macOS-Universal.dmg.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Build SHA256SUMS consolidated
        run: |
          cd all-artifacts
          ls -lh
          cat *.sha256 | sort > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS
          echo "=== Verification ==="
          sha256sum --check --ignore-missing SHA256SUMS || true

      - name: Verify all required assets are present
        run: |
          cd all-artifacts
          REQUIRED=(
            "Nexivora-Windows-x64.exe"
            "Nexivora-Windows-x64.msi"
            "Nexivora-Windows-x64-setup.exe"
            "Nexivora-Windows-Portable.zip"
            "Nexivora-Linux-x86_64.AppImage"
            "nexivora-amd64.deb"
            "nexivora-x86_64.rpm"
            "Nexivora-macOS-Intel.dmg"
            "Nexivora-macOS-AppleSilicon.dmg"
            "Nexivora-macOS-Universal.dmg"
          )
          MISSING=()
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "MISSING ASSETS: ${MISSING[*]}"
            echo "What we have:"
            ls -1
            exit 1
          fi
          echo "All required release assets present ✓"

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v0.1.0"
            fi
          fi
          echo "Release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists on current commit (workflow_dispatch path)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" HEAD
          git push -f origin "$TAG"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Nexivora ${{ steps.tag.outputs.tag }}
          fail_on_unmatched_files: true
          body: |
            ## Nexivora ${{ steps.tag.outputs.tag }}

            Free, open-source, privacy-first desktop productivity suite.

            ### Commit
            Built from commit `${{ github.sha }}` on `${{ github.event_name }}` trigger.

            ### 🪟 Windows
            | Format | Download |
            |--------|----------|
            | Portable EXE | [Nexivora-Windows-x64.exe](https://github.com/zypherlabs-bit/NEXIVORA/releases/download/${{ steps.tag.outputs.tag }}/Nexivora-Windows-x64.exe) |
            | MSI Installer | [Nexivora-Windows-x64.msi](https://github.com/zypherlabs-bit/NEXIVORA/releases/download/${{ steps.tag.outputs.tag }}/Nexivora-Windows-x64.msi) |
            | NSIS Setup | [Nexivora-Windows-x64-setup.exe](https://github.com/zypherlabs-bit/NEXIVORA/releases/download/${{ steps.tag.outputs.tag }}/Nexivora-Windows-x64-setup.exe) |
            | Portable ZIP | [Nexivora-Windows-Portable.zip](https://github.com/zypherlabs-bit/NEXIVORA/releases/download/${{ steps.tag.outputs.tag }}/Nexivora-Windows-Portable.zip) |

            ### 🐧 Linux
            | Format | Download |
            |--------|----------|
