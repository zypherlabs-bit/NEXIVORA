name: Release Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build — Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Code Signing — Setup certificate (optional)
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_CERTIFICATE != '' }}
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > private.pem
          echo "${{ secrets.TAURI_SIGNING_CERTIFICATE }}" > certificate.pem
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$(pwd)/private.pem" >> $GITHUB_ENV
          echo "TAURI_SIGNING_CERTIFICATE_PATH=$(pwd)/certificate.pem" >> $GITHUB_ENV

      - name: Build and bundle — Windows
        run: tauri build --bundles exe,msi,nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_CERTIFICATE_PATH: ${{ env.TAURI_SIGNING_CERTIFICATE_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Package — Portable ZIP
        run: |
          New-Item -ItemType Directory -Force -Path Nexivora-Portable | Out-Null
          Copy-Item target\release\nexivora-desktop.exe Nexivora-Portable\nexivora.exe
          Copy-Item README.md Nexivora-Portable\README.md
          Copy-Item LICENSE Nexivora-Portable\LICENSE
          Compress-Archive -Path Nexivora-Portable\* -DestinationPath Nexivora-Windows-Portable.zip -Force

      - name: Collect Windows artifacts
        run: |
          Copy-Item target\release\nexivora-desktop.exe Nexivora-Windows-x64.exe
          Copy-Item "target\release\bundle\msi\Nexivora_*_x64_en-US.msi" Nexivora-Windows-x64.msi
          Copy-Item "target\release\bundle\nsis\Nexivora_*_x64-setup.exe" Nexivora-Windows-x64-setup.exe

      - name: SHA-256 Checksums
        shell: pwsh
        run: |
          $h1 = (Get-FileHash -Algorithm SHA256 Nexivora-Windows-x64.exe).Hash.ToLower()
          "$h1  Nexivora-Windows-x64.exe" | Set-Content Nexivora-Windows-x64.exe.sha256 -Encoding ASCII
          $h2 = (Get-FileHash -Algorithm SHA256 Nexivora-Windows-x64.msi).Hash.ToLower()
          "$h2  Nexivora-Windows-x64.msi" | Set-Content Nexivora-Windows-x64.msi.sha256 -Encoding ASCII
          $h3 = (Get-FileHash -Algorithm SHA256 Nexivora-Windows-x64-setup.exe).Hash.ToLower()
          "$h3  Nexivora-Windows-x64-setup.exe" | Set-Content Nexivora-Windows-x64-setup.exe.sha256 -Encoding ASCII
          $h4 = (Get-FileHash -Algorithm SHA256 Nexivora-Windows-Portable.zip).Hash.ToLower()
          "$h4  Nexivora-Windows-Portable.zip" | Set-Content Nexivora-Windows-Portable.zip.sha256 -Encoding ASCII

      - name: Verify binaries exist
        run: |
          if (-not (Test-Path Nexivora-Windows-x64.exe)) { exit 1 }
          if (-not (Test-Path Nexivora-Windows-x64.msi)) { exit 1 }
          if (-not (Test-Path Nexivora-Windows-x64-setup.exe)) { exit 1 }
          if (-not (Test-Path Nexivora-Windows-Portable.zip)) { exit 1 }
          Write-Host "Windows artifacts OK"
          Get-Item Nexivora-Windows-x64.exe | Select-Object Name, Length
          Get-Item Nexivora-Windows-x64.msi | Select-Object Name, Length
          Get-Item Nexivora-Windows-x64-setup.exe | Select-Object Name, Length
          Get-Item Nexivora-Windows-Portable.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            Nexivora-Windows-x64.exe
            Nexivora-Windows-x64.exe.sha256
            Nexivora-Windows-x64.msi
            Nexivora-Windows-x64.msi.sha256
            Nexivora-Windows-x64-setup.exe
            Nexivora-Windows-x64-setup.exe.sha256
            Nexivora-Windows-Portable.zip
            Nexivora-Windows-Portable.zip.sha256

  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build — Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Code Signing — Linux (optional)
        if: ${{ secrets.TAURI_LINUX_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_LINUX_SIGNING_PASSPHRASE != '' }}
        run: |
          echo "${{ secrets.TAURI_LINUX_SIGNING_PRIVATE_KEY }}" > private.key
          gpg --import private.key
          echo "TAURI_LINUX_SIGNING_PRIVATE_KEY_PATH=$(pwd)/private.key" >> $GITHUB_ENV
          echo "TAURI_LINUX_SIGNING_PASSPHRASE=${{ secrets.TAURI_LINUX_SIGNING_PASSPHRASE }}" >> $GITHUB_ENV

      - name: Build and bundle — Linux
        run: tauri build --bundles appimage,deb,rpm
        env:
          TAURI_LINUX_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_LINUX_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_LINUX_SIGNING_PASSPHRASE: ${{ env.TAURI_LINUX_SIGNING_PASSPHRASE }}

      - name: Collect Linux artifacts
        run: |
          cp target/release/bundle/appimage/*.AppImage Nexivora-Linux-x86_64.AppImage
          cp target/release/bundle/deb/*.deb nexivora-amd64.deb
          cp target/release/bundle/rpm/*.rpm nexivora-x86_64.rpm

      - name: SHA-256 Checksums
        run: |
          sha256sum Nexivora-Linux-x86_64.AppImage > Nexivora-Linux-x86_64.AppImage.sha256
          sha256sum nexivora-amd64.deb > nexivora-amd64.deb.sha256
          sha256sum nexivora-x86_64.rpm > nexivora-x86_64.rpm.sha256

      - name: Verify binaries exist
        run: |
          ls -lh Nexivora-Linux-x86_64.AppImage nexivora-amd64.deb nexivora-x86_64.rpm
          test -f Nexivora-Linux-x86_64.AppImage || (echo "MISSING AppImage" && exit 1)
          test -f nexivora-amd64.deb || (echo "MISSING DEB" && exit 1)
          test -f nexivora-x86_64.rpm || (echo "MISSING RPM" && exit 1)
          echo "Linux artifacts OK"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            Nexivora-Linux-x86_64.AppImage
            Nexivora-Linux-x86_64.AppImage.sha256
            nexivora-amd64.deb
            nexivora-amd64.deb.sha256
            nexivora-x86_64.rpm
            nexivora-x86_64.rpm.sha256

  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build — macOS (Intel + Apple Silicon + Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Code Signing — macOS (optional)
        if: ${{ secrets.TAURI_SIGNING_IDENTITY != '' }}
        run: |
          echo "TAURI_SIGNING_IDENTITY=${{ secrets.TAURI_SIGNING_IDENTITY }}" >> $GITHUB_ENV
          echo "TAURI_NOTARYTOOL_APPLE_ID=${{ secrets.TAURI_NOTARYTOOL_APPLE_ID }}" >> $GITHUB_ENV
          echo "TAURI_NOTARYTOOL_APPLE_PASSWORD=${{ secrets.TAURI_NOTARYTOOL_APPLE_PASSWORD }}" >> $GITHUB_ENV
          echo "TAURI_NOTARYTOOL_TEAM_ID=${{ secrets.TAURI_NOTARYTOOL_TEAM_ID }}" >> $GITHUB_ENV

      - name: Build and bundle — macOS
        run: tauri build --bundles app,dmg
        env:
          TAURI_SIGNING_IDENTITY: ${{ env.TAURI_SIGNING_IDENTITY }}
          TAURI_NOTARYTOOL_APPLE_ID: ${{ env.TAURI_NOTARYTOOL_APPLE_ID }}
          TAURI_NOTARYTOOL_APPLE_PASSWORD: ${{ env.TAURI_NOTARYTOOL_APPLE_PASSWORD }}
          TAURI_NOTARYTOOL_TEAM_ID: ${{ env.TAURI_NOTARYTOOL_TEAM_ID }}

      - name: Collect macOS artifacts
        run: |
          cp target/release/bundle/dmg/*.dmg Nexivora-macOS-Intel.dmg 2>/dev/null || true
          cp target/release/bundle/dmg/*universal*.dmg Nexivora-macOS-Universal.dmg 2>/dev/null || true
          cp target/release/bundle/dmg/*aarch64*.dmg Nexivora-macOS-AppleSilicon.dmg 2>/dev/null || true
          ls -lh Nexivora-macOS-*.dmg

      - name: SHA-256 Checksums
        run: |
          shasum -a 256 Nexivora-macOS-Intel.dmg > Nexivora-macOS-Intel.dmg.sha256
          shasum -a 256 Nexivora-macOS-AppleSilicon.dmg > Nexivora-macOS-AppleSilicon.dmg.sha256
          shasum -a 256 Nexivora-macOS-Universal.dmg > Nexivora-macOS-Universal.dmg.sha256

      - name: Verify binaries exist
        run: |
          ls -lh Nexivora-macOS-*.dmg
          test -f Nexivora-macOS-Intel.dmg || (echo "MISSING Intel DMG" && exit 1)
          test -f Nexivora-macOS-AppleSilicon.dmg || (echo "MISSING AppleSilicon DMG" && exit 1)
          test -f Nexivora-macOS-Universal.dmg || (echo "MISSING Universal DMG" && exit 1)
          echo "macOS artifacts OK"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            Nexivora-macOS-Intel.dmg
            Nexivora-macOS-Intel.dmg.sha256
            Nexivora-macOS-AppleSilicon.dmg
            Nexivora-macOS-AppleSilicon.dmg.sha256
            Nexivora-macOS-Universal.dmg
            Nexivora-macOS-Universal.dmg.sha256

  # ─────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          cd all-artifacts
          ls -lh
          cat *.sha256 | sort > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Verify all required assets are present
        run: |
          cd all-artifacts
          REQUIRED=(
            "Nexivora-Windows-x64.exe"
            "Nexivora-Windows-x64.msi"
            "Nexivora-Windows-x64-setup.exe"
            "Nexivora-Windows-Portable.zip"
            "Nexivora-Linux-x86_64.AppImage"
            "nexivora-amd64.deb"
            "nexivora-x86_64.rpm"
            "Nexivora-macOS-Intel.dmg"
            "Nexivora-macOS-AppleSilicon.dmg"
            "Nexivora-macOS-Universal.dmg"
          )
          MISSING=()
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "MISSING ASSETS: ${MISSING[*]}"
            exit 1
          fi
          echo "All required release assets present ✓"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nexivora ${{ github.ref_name }}
          body: |
            ## Nexivora ${{ github.ref_name }}

            Free, open-source, privacy-first desktop productivity suite.

            ### 🪟 Windows
            | Format | Download |
            |--------|----------|
            | Portable EXE | [Nexivora-Windows-x64.exe](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/Nexivora-Windows-x64.exe) |
            | MSI Installer | [Nexivora-Windows-x64.msi](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/Nexivora-Windows-x64.msi) |
            | NSIS Setup | [Nexivora-Windows-x64-setup.exe](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/Nexivora-Windows-x64-setup.exe) |
            | Portable ZIP | [Nexivora-Windows-Portable.zip](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/Nexivora-Windows-Portable.zip) |

            ### 🐧 Linux
            | Format | Download |
            |--------|----------|
            | AppImage | [Nexivora-Linux-x86_64.AppImage](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/Nexivora-Linux-x86_64.AppImage) |
            | DEB      | [nexivora-amd64.deb](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/nexivora-amd64.deb) |
            | RPM      | [nexivora-x86_64.rpm](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/nexivora-x86_64.rpm) |

            ### 🍎 macOS
            | Format | Download |
            |--------|----------|
            | Universal      | [Nexivora-macOS-Universal.dmg](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/Nexivora-macOS-Universal.dmg) |
            | Apple Silicon  | [Nexivora-macOS-AppleSilicon.dmg](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/Nexivora-macOS-AppleSilicon.dmg) |
            | Intel          | [Nexivora-macOS-Intel.dmg](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/Nexivora-macOS-Intel.dmg) |

            ### Checksums
            Download [SHA256SUMS](https://github.com/zypherlabs-bit/NEXIVORA/releases/latest/download/SHA256SUMS) to verify integrity.
          draft: false
          prerelease: false
          files: |
            all-artifacts/Nexivora-Windows-x64.exe
            all-artifacts/Nexivora-Windows-x64.exe.sha256
            all-artifacts/Nexivora-Windows-x64.msi
            all-artifacts/Nexivora-Windows-x64.msi.sha256
            all-artifacts/Nexivora-Windows-x64-setup.exe
            all-artifacts/Nexivora-Windows-x64-setup.exe.sha256
            all-artifacts/Nexivora-Windows-Portable.zip
            all-artifacts/Nexivora-Windows-Portable.zip.sha256
            all-artifacts/Nexivora-Linux-x86_64.AppImage
            all-artifacts/Nexivora-Linux-x86_64.AppImage.sha256
            all-artifacts/nexivora-amd64.deb
            all-artifacts/nexivora-amd64.deb.sha256
            all-artifacts/nexivora-x86_64.rpm
            all-artifacts/nexivora-x86_64.rpm.sha256
            all-artifacts/Nexivora-macOS-Intel.dmg
            all-artifacts/Nexivora-macOS-Intel.dmg.sha256
            all-artifacts/Nexivora-macOS-AppleSilicon.dmg
            all-artifacts/Nexivora-macOS-AppleSilicon.dmg.sha256
            all-artifacts/Nexivora-macOS-Universal.dmg
            all-artifacts/Nexivora-macOS-Universal.dmg.sha256
            all-artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
