name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nexivora-linux-x86_64
            asset_name: Nexivora-Linux-x86_64.AppImage
            build_command: cargo build --release --target x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nexivora-macos-intel
            asset_name: Nexivora-macOS-Intel.dmg
            build_command: cargo build --release --target x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nexivora-macos-apple-silicon
            asset_name: Nexivora-macOS-AppleSilicon.dmg
            build_command: cargo build --release --target aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nexivora-windows-x64
            asset_name: Nexivora-Windows-x64.exe
            build_command: cargo build --release --target x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gtk+3 webkitgtk

      - name: Build
        run: ${{ matrix.build_command }}

      - name: Package (Linux AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install appimagetool
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          cp target/x86_64-unknown-linux-gnu/release/nexivora-desktop AppDir/usr/bin/nexivora
          cp assets/nexivora.png AppDir/nexivora.png
          
          # Create desktop file
          cat > AppDir/nexivora.desktop << 'EOF'
          [Desktop Entry]
          Name=Nexivora
          Exec=nexivora
          Icon=nexivora
          Type=Application
          Categories=Office;
          Terminal=false
          EOF
          
          # Build AppImage
          ./appimagetool-x86_64.AppImage AppDir ${{ matrix.asset_name }}
          
          # Clean up
          rm appimagetool-x86_64.AppImage
          rm -rf AppDir

      - name: Package (macOS DMG)
        if: matrix.os == 'macos-latest'
        run: |
          # Create DMG
          mkdir -p Nexivora.app/Contents/MacOS
          mkdir -p Nexivora.app/Contents/Resources
          
          # Copy binary
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            cp target/x86_64-apple-darwin/release/nexivora-desktop Nexivora.app/Contents/MacOS/Nexivora
          else
            cp target/aarch64-apple-darwin/release/nexivora-desktop Nexivora.app/Contents/MacOS/Nexivora
          fi
          
          # Create Info.plist
          cat > Nexivora.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Nexivora</string>
            <key>CFBundleIdentifier</key>
            <string>org.nexivora.Nexivora</string>
            <key>CFBundleName</key>
            <string>Nexivora</string>
            <key>CFBundleVersion</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          EOF
          
          # Create DMG
          hdiutil create -volname Nexivora -srcfolder Nexivora.app -ov -format UDZO ${{ matrix.asset_name }}
          
          # Clean up
          rm -rf Nexivora.app

      - name: Package (Windows Installer)
        if: matrix.os == 'windows-latest'
        run: |
          # This is a placeholder - in a real scenario, you would use a proper Windows installer tool
          # For now, we'll just rename the executable
          cp target/x86_64-pc-windows-msvc/release/nexivora-desktop.exe ${{ matrix.asset_name }}

      - name: Generate SHA256 checksum
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certUtil -hashfile ${{ matrix.asset_name }} SHA256 > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/nexivora-linux-x86_64/Nexivora-Linux-x86_64.AppImage
          asset_name: Nexivora-Linux-x86_64.AppImage
          asset_content_type: application/octet-stream

      - name: Upload Linux Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/nexivora-linux-x86_64/Nexivora-Linux-x86_64.AppImage.sha256
          asset_name: Nexivora-Linux-x86_64.AppImage.sha256
          asset_content_type: text/plain

      - name: Upload macOS Intel
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/nexivora-macos-intel/Nexivora-macOS-Intel.dmg
          asset_name: Nexivora-macOS-Intel.dmg
          asset_content_type: application/octet-stream

      - name: Upload macOS Intel Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/nexivora-macos-intel/Nexivora-macOS-Intel.dmg.sha256
          asset_name: Nexivora-macOS-Intel.dmg.sha256
          asset_content_type: text/plain

      - name: Upload macOS Apple Silicon
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/nexivora-macos-apple-silicon/Nexivora-macOS-AppleSilicon.dmg
          asset_name: Nexivora-macOS-AppleSilicon.dmg
          asset_content_type: application/octet-stream

      - name: Upload macOS Apple Silicon Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/nexivora-macos-apple-silicon/Nexivora-macOS-AppleSilicon.dmg.sha256
          asset_name: Nexivora-macOS-AppleSilicon.dmg.sha256
          asset_content_type: text/plain

      - name: Upload Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/nexivora-windows-x64/Nexivora-Windows-x64.exe
          asset_name: Nexivora-Windows-x64.exe
          asset_content_type: application/octet-stream

      - name: Upload Windows Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/nexivora-windows-x64/Nexivora-Windows-x64.exe.sha256
          asset_name: Nexivora-Windows-x64.exe.sha256
          asset_content_type: text/plain