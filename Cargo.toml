[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/formula-engine",
    "crates/spreadsheet-engine",
    "crates/document-engine",
    "crates/presentation-engine",
    "crates/database-engine",
    "crates/pdf-engine",
    "crates/graphics-engine",
    "crates/rendering-engine",
    "crates/import-export",
    "crates/printing",
    "crates/accessibility",
    "crates/localization",
    "crates/automation",
    "crates/plugin-system",
    "crates/security",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Nexivora Contributors"]
repository = "https://github.com/zypherlabs-bit/NEXIVORA"
homepage = "https://github.com/zypherlabs-bit/NEXIVORA"
documentation = "https://github.com/zypherlabs-bit/NEXIVORA/blob/master/docs/README.md"
keywords = ["office", "productivity", "spreadsheet", "document", "presentation"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
indexmap = { version = "2", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde", "maths"] }
rust_decimal_macros = "1"
num-traits = "0.2"
num-bigint = "0.4"
num-complex = "0.4"
unicode-segmentation = "1"
unicode-normalization = "0.1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
quick-xml = "0.36"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes = "0.8"
ctr = "0.9"
rand = "0.8"
tempfile = "3"
fs2 = "0.4"
walkdir = "2"
glob = "0.3"
path-clean = "1"
url = "2"
percent-encoding = "2"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
svg = "0.19"
resvg = "0.43"
tiny-skia = "0.11"
usvg = "0.43"
fontdb = "0.18"
rustybuzz = "0.14"
ttf-parser = "0.24"
lopdf = "0.34"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
html-escape = "0.2"
pulldown-cmark = "0.12"
syntect = "5"
dirs = "5"
directories = "5"
once_cell = "1"
parking_lot = "0.12"
rayon = "1"
dashmap = "6"
smallvec = "1"
bitflags = "2"
byteorder = "1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Dev / test
criterion = "0.5"
proptest = "1"
arbitrary = "1"
libfuzzer-sys = "0.4"